[package]
name = "chaserland-articles-service-server"
version = "0.1.0"
edition = "2024"

[dependencies]
chaserland-protos = { path = "../../../chaserland-protos" }
chaserland-observability = { path = "../../../chaserland-observability" }
chaserland-common = { path = "../../../chaserland-common", features = [
    "figment-file-provider",
    "pagination",
] }
chaserland-articles-service-migrate = { path = "../migrate" }
tokio = { version = "1.44.1", features = [
    "macros",
    "signal",
    "rt-multi-thread",
] }
tonic = "0.13.1"
tracing = "0.1.41"
sqlx = { version = "0.8.6", features = [
    "chrono",
    "postgres",
    "runtime-tokio",
    "migrate",
] }
serde = { version = "1.0.219", features = ["derive"] }
chrono = { version = "0.4.40", features = ["serde"] }
anyhow = "1.0.97"
prost-types = "0.13.5"
slugify = "0.1.0"
log = "0.4.27"
async-trait = "0.1.88"
thiserror = "2.0.12"
opentelemetry = "0.30.0"
opentelemetry_sdk = { version = "0.30.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30.0", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.30.0", features = [
    "semconv_experimental",
] }
opentelemetry-http = "0.30.0"
tracing-opentelemetry = "0.31.0"
figment = { version = "0.10.19", features = ["env", "test"] }
clap = { version = "4.5.38", features = ["derive"] }
tower = "0.5.2"
http = "1.3.1"
tonic-health = "0.13.1"
tower-http = { version = "0.6.4", features = ["trace"] }
