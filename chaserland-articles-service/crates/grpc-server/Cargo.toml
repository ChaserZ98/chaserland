[package]
name = "chaserland-articles-service-grpc-server"
version = "0.1.0"
edition = "2024"

[dependencies]
chaserland-protos = { path = "../../../chaserland-protos" }
chaserland-articles-service-core = { path = "../core" }
chaserland-observability = { path = "../../../chaserland-observability" }
chaserland-common = { path = "../../../chaserland-common", features = [
    "figment-file-provider",
] }
tokio = { version = "1.44.1", features = [
    "macros",
    "signal",
    "rt-multi-thread",
] }
anyhow = "1.0.97"
figment = { version = "0.10.19", features = ["env", "test"] }
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.5.38", features = ["derive"] }
tonic = "0.13.1"
tonic-health = "0.13.1"
tracing = "0.1.41"
tracing-opentelemetry = "0.31.0"
opentelemetry = "0.30.0"
opentelemetry-http = "0.30.0"
http = "1.3.1"
tower-http = { version = "0.6.4", features = ["trace"] }
