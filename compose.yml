name: chaserland

services:
  article-migrate:
    build:
      context: .
      dockerfile: ./chaserland-articles-service/docker/migrate.Dockerfile
    image: chaserland/article-service-migrate:${VERSION}
  article-service:
    build:
      context: .
      dockerfile: ./chaserland-articles-service/docker/server.Dockerfile
    image: chaserland/article-service-server:${VERSION}
    depends_on:
      - article-migrate
