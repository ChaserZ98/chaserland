syntax = "proto3";

package chaserland.article;

import "google/protobuf/timestamp.proto";

service ArticleService {
  rpc CreateArticle (CreateArticleRequest) returns (CreateArticleResponse);
  rpc CreateSeries (CreateSeriesRequest) returns (CreateSeriesResponse);
  rpc CreateCategory (CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc CreateTag (CreateTagRequest) returns (CreateTagResponse);

  rpc GetArticlesMeta (GetArticlesMetaRequest)
    returns (GetArticlesMetaResponse);
  rpc GetArticlesMetaBySeriesSlug (GetArticlesMetaBySeriesSlugRequest)
    returns (GetArticlesMetaResponse);
  rpc GetArticlesMetaByCategorySlug (GetArticlesMetaByCategorySlugRequest)
    returns (GetArticlesMetaResponse);
  rpc GetArticlesMetaByTagSlug (GetArticlesMetaByTagSlugRequest)
    returns (GetArticlesMetaResponse);
  rpc GetArticleContentBySlug (GetArticleContentBySlugRequest)
    returns (GetArticleContentBySlugResponse);
  rpc GetSeries (GetSeriesRequest) returns (GetSeriesResponse);
  rpc GetCategories (GetCategoriesRequest) returns (GetCategoriesResponse);
  rpc GetTags (GetTagsRequest) returns (GetTagsResponse);

  rpc PublishArticleById (PublishArticleByIdRequest)
    returns (PublishArticleByIdResponse);

  rpc DeleteArticleById (DeleteArticleByIdRequest) 
    returns (DeleteArticleByIdResponse);
  rpc DeleteSeriesById (DeleteSeriesByIdRequest)
    returns (DeleteSeriesByIdResponse);
  rpc DeleteCategoryById (DeleteCategoryByIdRequest)
    returns (DeleteCategoryByIdResponse);
  rpc DeleteTagById (DeleteTagByIdRequest) returns (DeleteTagByIdResponse);
}

message CreateArticleRequest {
  ArticleCreate article = 1;
}

message CreateArticleResponse {
  Article article = 1;
}

message CreateSeriesRequest {
  SeriesCreate series = 1;
}

message CreateSeriesResponse {
  Series series = 1;
}

message CreateCategoryRequest {
  CategoryCreate category = 1;
}

message CreateCategoryResponse {
  Category category = 1;
}

message CreateTagRequest {
  TagCreate tag = 1;
}

message CreateTagResponse {
  Tag tag = 1;
}

message GetArticlesMetaRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message GetArticlesMetaResponse {
  repeated ArticleMeta articles_metas = 1;
}

message GetArticlesMetaBySeriesSlugRequest {
  string series_slug = 1;
}

message GetArticlesMetaByCategorySlugRequest {
  string category_slug = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetArticlesMetaByTagSlugRequest {
  string tag_slug = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetArticleContentBySlugRequest {
  string slug = 1;
}

message GetArticleContentBySlugResponse {
  string content = 1;
}

message GetSeriesRequest {

}

message GetSeriesResponse {
  repeated Series series = 1;
}

message GetCategoriesRequest {

}

message GetCategoriesResponse {
  repeated Category categories = 1;
}

message GetTagsRequest {

}

message GetTagsResponse {
  repeated Tag tags = 1;
}

message PublishArticleByIdRequest {
  int32 id = 1;
}

message PublishArticleByIdResponse {

}

message DeleteArticleByIdRequest {
  int32 id = 1;
}

message DeleteArticleByIdResponse {
  
}

message DeleteSeriesByIdRequest {
  int32 id = 1;
}

message DeleteSeriesByIdResponse {
  
}

message DeleteCategoryByIdRequest {
  int32 id = 1;
}

message DeleteCategoryByIdResponse {
  
}

message DeleteTagByIdRequest {
  int32 id = 1;
}

message DeleteTagByIdResponse {
  
}

message Series {
  int32 id = 1;
  string slug = 2;
  string name = 3;
}

message SeriesCreate {
  string name = 1;
}

message Tag {
  int32 id = 1;
  string name = 2;
  string slug = 3;
}

message TagCreate {
  string name = 1;
}

message Category {
  int32 id = 1;
  string name = 2;
  string slug = 3;
}

message CategoryCreate {
  string name = 1;
}

message Article {
  int32 id = 1;
  string title = 2;
  string slug = 3;
  string description = 4;
  string content = 5;
  optional Series series = 6;
  repeated Category categories = 7;
  repeated Tag tags = 8;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp published_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional google.protobuf.Timestamp deleted_at = 12;
}

message ArticleCreate {
  string title = 1;
  string description = 2;
  string content = 3;
  optional int32 series_id = 4;
  repeated int32 category_ids = 5;
  repeated int32 tag_ids = 6;
}

message ArticleMeta {
  int32 id = 1;
  string title = 2;
  string slug = 3;
  string description = 4;
  optional Series series = 5;
  repeated Category categories = 6;
  repeated Tag tags = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp published_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional google.protobuf.Timestamp deleted_at = 11;
}
